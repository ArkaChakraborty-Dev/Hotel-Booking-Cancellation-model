project:
  name: "hotel-booking-cancellation"
  version: "1.0.0"

data:
  raw_path: "data/hotel_bookings.csv.zip"
  fallback_csv_path: "data/hotel_bookings.csv"
  target_column: "is_canceled"
  drop_duplicates: true
  
  # Columns that leak target information or are unavailable at booking time
  leakage_columns:
    - "reservation_status"
    - "reservation_status_date"
    - "assigned_room_type"
    - "booking_changes"

  # Outlier cleaning rules
  cleaning:
    min_adr: 0.0
    max_adr: 5000.0
    fill_missing_children: 0.0
    fill_missing_country: "Unknown"
    fill_missing_agent_company: "Unknown"

splitting:
  test_size: 0.2
  val_size: 0.2
  random_state: 42
  stratify: true

preprocessing:
  numeric_imputer_strategy: "median"
  scaler_type: "standard" # standard or robust
  categorical_imputer_strategy: "constant"
  categorical_fill_value: "Unknown"
  ohe_min_frequency: 0.01 # groups rare categories (e.g. hundreds of rare agents/countries) to prevent overfitting
  ohe_handle_unknown: "infrequent_if_exist"

models:
  random_forest:
    n_estimators: 200
    max_depth: 20
    min_samples_split: 5
    min_samples_leaf: 2
    class_weight: "balanced"
    random_state: 42
    n_jobs: -1

  logistic_regression:
    max_iter: 1000
    class_weight: "balanced"
    random_state: 42
    C: 1.0

threshold_tuning:
  enabled: true
  metric: "f1" # options: f1, recall, precision, roc_auc
  threshold_min: 0.2
  threshold_max: 0.8
  threshold_step: 0.05
  default_threshold: 0.5

artifacts:
  model_dir: "models"
  model_filename: "hotel_cancellation_model.joblib"
